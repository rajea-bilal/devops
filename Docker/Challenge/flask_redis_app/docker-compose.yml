
services:
  web:
    build: ./flask_container
    volumes:
     - shared-data:/app/data
    expose: 
     - "5004"
    depends_on:
     - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  redis: 
    build: ./redis_container
    volumes:
      - shared-data:/data
  nginx:
    image: nginx:latest
    ports:
     - "5004:5004"
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
    - web


volumes:
  shared-data: {}