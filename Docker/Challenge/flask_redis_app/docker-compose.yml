
services:
  web:
    build: ./flask_container
 
    expose: 
     - "5004"

    depends_on:
     - redis

    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

    restart: unless-stopped

  redis: 
    build: ./redis_container

    volumes:
      - shared-data:/data
    
    restart: unless-stopped

  nginx:
    image: nginx:latest

    ports:
     - "5004:5004"

    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
     - web
    
    restart: unless-stopped


volumes:
  shared-data: {}